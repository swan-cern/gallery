
# Project information
site_name: 'Gallery'
site_description: 'Examples gallery for SWAN'
site_url: 'https://swan-gallery.web.cern.ch/'
site_dir: 'public'

# Repository
repo_url: 'https://github.com/swan-cern/gallery'

# Theme configuration
theme:
  name: 'swan'
  palette:
    # Light mode (default, follows OS preference)
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - swangallery:
      gallery_url: https://swan-gallery.web.cern.ch
      open_in_swan_url: https://cern.ch/swanserver/cgi-bin/go?projurl=

# Navigation menu
nav:
  - basic.md
  - root_primer.md
  - accelerator_complex.md
  # - lhc-sm.md
  - beams_dynamics.md
  - machine_learning.md
  - awake.md
  - outreach.md
  - apache_spark.md
  - datatools.md
  - deeplearning-GPU.md
  - aitools.md
